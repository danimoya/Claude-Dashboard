version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: claude-dashboard-postgres
    environment:
      POSTGRES_DB: claude_dashboard_dev
      POSTGRES_USER: claude
      POSTGRES_PASSWORD: dev_password_change_in_production
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claude"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - claude-network

  redis:
    image: redis:7-alpine
    container_name: claude-dashboard-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - claude-network

  adminer:
    image: adminer:latest
    container_name: claude-dashboard-adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - claude-network

volumes:
  postgres_data:
  redis_data:

networks:
  claude-network:
    driver: bridge
